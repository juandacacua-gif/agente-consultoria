# App + ejecutor de R aislado.
#
#   docker compose up -d --build
#
# La app (red "frontend" + "interna") habla con Gemini y con el ejecutor.
# El ejecutor (solo red "interna", que no tiene salida a internet) no recibe
# la clave de la API y su sistema de archivos es de solo lectura.
services:
  app:
    build: .
    image: agente-consultoria:compose
    env_file: .env
    environment:
      RUNNER_URL: http://r-runner:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      r-runner:
        condition: service_healthy
    networks:
      - frontend
      - interna

  r-runner:
    build: ./r-runner
    image: agente-r-runner:compose
    init: true
    read_only: true
    tmpfs:
      - /work:rw,size=256m,mode=1777
      - /tmp:rw,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    environment:
      RUN_TIMEOUT: "120"
    networks:
      - interna

networks:
  frontend: {}
  interna:
    internal: true
